syntax = "proto3";

package logstream;

option java_multiple_files = true;
option java_package = "com.logstream.backend.grpc";
option java_outer_classname = "LogMessageProto";

message LogMessage {

    string timestamp = 1;

    string service = 2;

    string level = 3;

    string message = 4;
}

message LogResponse {

    bool success = 1;

    string message = 2;
}

message LogBatch {

    repeated LogMessage logs = 1;
}

service LogIngestionService {

    // Existing single-log API
    rpc SendLog(LogMessage) returns (LogResponse);

    // New high-throughput batch API
    rpc SendLogs(LogBatch) returns (LogResponse);
}